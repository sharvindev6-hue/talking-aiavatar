<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin sign in · Avatar AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    .auth-logo.admin {
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.25), rgba(167, 139, 250, 0.06));
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #a78bfa;
    }
    .auth-badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.3);
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }
    .auth-footnote.admin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .auth-footnote.admin svg { width: 13px; height: 13px; }
  </style>
</head>
<body>
  <div class="auth-backdrop">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-badge">Restricted area</span>
        <div class="auth-logo admin" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.5-3 8.4-7 10-4-1.6-7-5.5-7-10V6l7-3z" />
            <path d="M9.5 12l1.8 1.8L15 10" />
          </svg>
        </div>
        <h1>Admin Console</h1>
        <p class="auth-subtitle">Authorized personnel only</p>
      </div>

      <form id="admin-login-form" autocomplete="on" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input id="email" type="email" name="email" placeholder="admin@example.com" required autocomplete="username" />
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <div class="password-wrap">
            <input id="password" type="password" name="password" placeholder="Admin password" required autocomplete="current-password" />
            <button type="button" id="toggle-pass" class="password-toggle" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </div>
        </label>

        <div id="admin-error" class="auth-error" hidden></div>

        <button type="submit" id="submit-btn" class="auth-submit">Sign in to console</button>
      </form>

      <p class="auth-footnote admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.4-7 10-4-1.6-7-5.5-7-10V6l7-3z" /></svg>
        Protected by signed admin session
      </p>
    </div>
  </div>

  <script type="module" src="/js/admin-login.js"></script>
</body>
</html>
