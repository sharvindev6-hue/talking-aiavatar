<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@met4citizen/talkinghead": "/vendor/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <aside class="avatar-panel">
      <div id="avatar-stage" class="avatar-stage"></div>
      <div id="avatar-loading" class="avatar-loading">Loading avatar…</div>
      <div id="status-chip" class="status-chip" data-state="idle">Ready</div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <h1>Avatar AI</h1>
          <p class="subtitle">Powered by Kimi &amp; ElevenLabs</p>
        </div>
        <div class="chat-header-actions">
          <div id="connection-status" class="connection-status">Checking…</div>
          <button type="button" id="new-chat-btn" class="icon-btn" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" id="history-btn" class="icon-btn" title="History" aria-label="History">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          </button>
          <button type="button" id="memory-btn" class="icon-btn" title="What I remember" aria-label="What I remember">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4c0 1.1-.4 2-1.1 2.7.7 1 1.1 2.2 1.1 3.5 0 1.5-.6 2.9-1.6 3.9.4.5.6 1.1.6 1.8a4 4 0 0 1-4 4 4 4 0 0 1-4-4c0-.7.2-1.3.6-1.8A5.5 5.5 0 0 1 7 12.2c0-1.3.4-2.5 1.1-3.5A3.9 3.9 0 0 1 8 6a4 4 0 0 1 4-4z"/><path d="M12 6v2"/><path d="M10 10h4"/></svg>
          </button>
          <div class="user-chip">
            <span id="user-email" class="user-email">…</span>
            <button type="button" id="logout-btn" class="logout-btn" title="Log out">Log out</button>
          </div>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="composer" class="composer" autocomplete="off">
        <div id="attachment-preview" class="attachment-preview" hidden></div>
        <div class="composer-row">
          <button type="button" id="attach-btn" class="icon-btn" title="Attach image or file" aria-label="Attach image or file">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input id="file-input" type="file" accept="image/*,.pdf,.doc,.docx,.txt,.md,.csv,.xls,.xlsx,.ppt,.pptx,.zip" multiple hidden />
          <button type="button" id="mic-btn" class="icon-btn" title="Voice input" aria-label="Voice input">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </button>
          <input id="message-input" type="text" placeholder="Type a message…" maxlength="2000" />
          <button type="submit" id="send-btn" class="send-btn">Send</button>
          <button type="button" id="interrupt-btn" class="interrupt-btn" hidden>Stop</button>
        </div>
      </form>
    </main>
  </div>

  <div id="history-overlay" class="history-overlay" hidden></div>
  <aside id="history-drawer" class="history-drawer" aria-hidden="true">
    <header class="history-header">
      <h2>History</h2>
      <button type="button" id="history-close" class="icon-btn" aria-label="Close history">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div id="history-list" class="history-list"></div>
    <div id="history-empty" class="history-empty" hidden>No conversations yet.<br />Start chatting and they'll appear here.</div>
  </aside>

  <div id="memory-overlay" class="history-overlay" hidden></div>
  <aside id="memory-drawer" class="history-drawer" aria-hidden="true">
    <header class="history-header">
      <h2>What I remember</h2>
      <button type="button" id="memory-close" class="icon-btn" aria-label="Close memory">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="memory-toolbar">
      <span class="memory-hint">Facts the avatar learned about you.</span>
      <button type="button" id="memory-forget-all" class="memory-forget-all" hidden>Forget everything</button>
    </div>
    <div id="memory-list" class="memory-list"></div>
    <div id="memory-empty" class="history-empty" hidden>
      Nothing stored yet.<br />Tell the avatar about yourself and it will remember across chats.
    </div>
  </aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
