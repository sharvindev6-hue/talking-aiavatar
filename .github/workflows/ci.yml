name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Syntax + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (syntax + security + parser)
        run: npm test
